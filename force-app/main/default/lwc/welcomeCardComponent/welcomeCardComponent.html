<template>
    <lightning-card>
        <div class="slds-p-around_large">

            <h1 class="slds-text-heading_large slds-m-bottom_medium">
                Welcome to Duplicate Finder
            </h1>

            <p class="slds-m-bottom_small">
                Thank you for installing Duplicate Finder.
            </p>

            <p class="slds-m-bottom_small">
                This application helps you identify, review, and merge duplicate records across your Salesforce organization.
            </p>

            <p class="slds-m-bottom_large">
                Click <strong>Next</strong> to complete the initial setup before running your first duplicate scan.
            </p>

            <div class="slds-text-align_right">
                <lightning-button
                    variant="brand"
                    label="Next"
                    onclick={handleNext}>
                </lightning-button>
            </div>

        </div>
    </lightning-card>
</template>
